<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="基本情報技術者試験をiPhoneで学ぶ、シラバス準拠の読めるテキスト。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>FE Pocket</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-view="home" aria-label="ホームへ"><span class="brand-mark">FE</span><span>POCKET</span></button>
    <div class="header-actions">
      <button id="fontBtn" class="icon-btn" aria-label="文字サイズを変更">文字</button>
      <button id="searchBtn" class="icon-btn" aria-label="教材を検索">⌕</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button data-view="home" class="active"><span>⌂</span>ホーム</button>
    <button data-view="library"><span>▤</span>テキスト</button>
    <button data-view="bookmarks"><span>◇</span>保存</button>
    <button data-view="about"><span>ⓘ</span>この教材</button>
  </nav>

  <dialog id="searchDialog">
    <form method="dialog" class="search-head"><input id="searchInput" type="search" placeholder="例：2進数、SQL、暗号" aria-label="教材を検索"><button aria-label="閉じる">×</button></form>
    <div id="searchResults"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
